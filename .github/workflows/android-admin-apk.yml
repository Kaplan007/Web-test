name: ŠAPI Foto Admin Android APK

on:
  push:
    branches:
      - feature/android-admin-app
      - feature/android-admin-dashboard
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapi-foto-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # GitHub-hosted Ubuntu images already contain the Android SDK.
      # Avoid setup-android@v3 here: it attempts to install the obsolete
      # SDK package "tools", which now fails with "Failed to find package".
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android platform and build tools
        run: |
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle configuration
        working-directory: android-admin
        run: gradle --no-daemon tasks --all

      - name: Build APK
        working-directory: android-admin
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          test -s android-admin/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-admin/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapi-foto-admin-android-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
