name: ŠAPI Foto Admin Android APK

on:
  push:
    branches:
      - feature/android-admin-app
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-admin-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sapi-foto-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle configuration
        working-directory: android-admin
        run: gradle --no-daemon tasks --all

      - name: Build APK
        working-directory: android-admin
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK exists and is non-empty
        shell: bash
        run: |
          test -s android-admin/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-admin/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapi-foto-admin-android-debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
