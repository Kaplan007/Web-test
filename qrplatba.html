<style>
.qr-generator {
    max-width: 520px;
}

.qr-generator label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: 600;
}

.qr-generator input {
    width: 100%;
    box-sizing: border-box;
}

.qr-generator button {
    margin-top: 22px;
}

#qrResult {
    display: none;
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
}

#qrCode {
    margin-top: 20px;
    text-align: center;
}

#qrCode canvas,
#qrCode img {
    display: block;
    margin: auto;
}

.payment-info {
    line-height: 1.7;
}

.error {
    color: #b00020;
    margin-top: 10px;
    display: none;
}
</style>

<main class="content">
<h1>Generátor QR platby</h1>
<div class="qr-generator">
<p>
        Platba na účet <strong>332726377/0300</strong>.
    </p>
<label for="vs">Variabilní symbol:</label>
<input id="vs" inputmode="numeric" maxlength="4" placeholder="4místné číslo objednávky" type="text"/>
<label for="amount">Částka:</label>
<input id="amount" max="1000000" min="1" step="1" type="number" value="200"/>
<button id="generateBtn" type="button">
        Vygenerovat QR platbu
    </button>
<div aria-live="assertive" class="error" id="error"></div>
<div id="qrResult">
<div class="payment-info">
<strong>Údaje pro platbu</strong><br/>
            Číslo účtu: 332726377/0300<br/>
            Variabilní symbol: <span id="resultVS"></span><br/>
            Částka: <span id="resultAmount"></span> Kč
        </div>
<div id="qrCode"></div><p id="qrFallback" role="status"></p>
</div>
</div>
</main>
