<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generátor QR platby | ŠAPI Foto</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
.qr-generator {
    max-width: 520px;
}

.qr-generator label {
    display: block;
    margin-top: 18px;
    margin-bottom: 6px;
    font-weight: 600;
}

.qr-generator input {
    width: 100%;
    box-sizing: border-box;
}

.qr-generator button {
    margin-top: 22px;
}

#qrResult {
    display: none;
    margin-top: 30px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
}

#qrCode {
    margin-top: 20px;
    text-align: center;
}

#qrCode canvas,
#qrCode img {
    display: block;
    margin: auto;
}

.payment-info {
    line-height: 1.7;
}

.error {
    color: #b00020;
    margin-top: 10px;
    display: none;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<div class="container">

<aside class="sidebar">
    <div class="logo">
        <a href="index.html"><img src="img/logo.webp" alt="Logo"></a>
    </div>

    <ul>
        <li class="home">
            <a href="index.html">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/>
                </svg>
            </a>
        </li>
        <li><a href="omne.html">O mně</a></li>
        <li><a href="fotogalerie.html">Fotogalerie</a></li>
        <li><a href="sluzby.html">Služby</a></li>
        <li><a href="dnfoto.html">DN foto</a></li>
        <li><a href="tisk.html">Tisk</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
    </ul>

    <div class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
    </div>
</aside>

<nav class="mobile-menu" id="mobileMenu">
    <ul>
        <li><a href="index.html">Úvod</a></li>
        <li><a href="omne.html">O mně</a></li>
        <li><a href="fotogalerie.html">Fotogalerie</a></li>
        <li><a href="sluzby.html">Služby</a></li>
        <li><a href="dnfoto.html">DN foto</a></li>
        <li><a href="tisk.html">Tisk</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
    </ul>
</nav>

<main class="content">

<h1>Generátor QR platby</h1>

<div class="qr-generator">

    <p>
        Platba na účet <strong>332726377/0300</strong>.
    </p>

    <label for="vs">Variabilní symbol:</label>
    <input
        type="text"
        id="vs"
        inputmode="numeric"
        maxlength="4"
        placeholder="4místné číslo objednávky">

    <label for="amount">Částka:</label>
    <input
        type="number"
        id="amount"
        min="1"
        step="1"
        value="200">

    <button type="button" id="generateBtn">
        Vygenerovat QR platbu
    </button>

    <div id="error" class="error"></div>

    <div id="qrResult">

        <div class="payment-info">
            <strong>Údaje pro platbu</strong><br>
            Číslo účtu: 332726377/0300<br>
            Variabilní symbol: <span id="resultVS"></span><br>
            Částka: <span id="resultAmount"></span> Kč
        </div>

        <div id="qrCode"></div>

    </div>

</div>

</main>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const vsInput = document.getElementById('vs');
    const amountInput = document.getElementById('amount');
    const generateBtn = document.getElementById('generateBtn');
    const qrResult = document.getElementById('qrResult');
    const qrCode = document.getElementById('qrCode');
    const error = document.getElementById('error');

    vsInput.addEventListener('input', () => {
        vsInput.value = vsInput.value.replace(/\D/g, '').slice(0, 4);
    });

    generateBtn.addEventListener('click', () => {

        const vs = vsInput.value.trim();
        const amount = amountInput.value.trim();

        error.style.display = 'none';
        error.textContent = '';

        if (!/^\d{4}$/.test(vs)) {
            error.textContent = 'Zadejte přesně 4místný variabilní symbol.';
            error.style.display = 'block';
            qrResult.style.display = 'none';
            return;
        }

        if (!amount || Number(amount) <= 0) {
            error.textContent = 'Zadejte platnou částku.';
            error.style.display = 'block';
            qrResult.style.display = 'none';
            return;
        }

        const amountFormatted = Number(amount).toFixed(2);

        const spd =
            `SPD*1.0*ACC:CZ9203000000000332726377*AM:${amountFormatted}*CC:CZK*X-VS:${vs}`;

        qrCode.innerHTML = '';

        new QRCode(qrCode, {
            text: spd,
            width: 280,
            height: 280
        });

        document.getElementById('resultVS').textContent = vs;
        document.getElementById('resultAmount').textContent = Number(amount).toLocaleString('cs-CZ');

        qrResult.style.display = 'block';
    });

    document.getElementById('hamburger').onclick = () =>
        document.getElementById('mobileMenu').classList.toggle('active');

});
</script>

</body>
</html>
