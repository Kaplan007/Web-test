<style>
/* Hero sekce */
.hero {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 100vh;
    background: url('img/2.webp') no-repeat center center;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
    padding: 0 20px;
}

.hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.4);
}

.hero-text {
    font-family: 'Dancing Script', cursive;
    font-size: 2.2rem;  /* nebo jinak podle potřeby */
    font-weight: 600;    /* silnější pro větší výraznost */
    position: relative;
    z-index: 1;
    max-width: 800px;
    line-height: 1.5;
    text-align: center;
    color: #fff;
}
@media (max-width: 800px) {
    .hero-text { font-size: 1.6rem; }
}

/* Hamburger menu pro mobil */
.hamburger {
    display: none;
    flex-direction: column;
    cursor: pointer;
    width: 28px;
    height: 20px;
    justify-content: space-between;
}

.hamburger span {
    display: block;
    height: 3px;
    background: #111;
    border-radius: 3px;
}

.mobile-menu.active { right: 0; }

.mobile-menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
}

.mobile-menu ul li { margin: 20px 0; }

.mobile-menu ul li a {
    text-decoration: none;
    color: #111;
    font-size: 16px;
}

/* Sidebar / topbar */
@media (max-width: 800px) {
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 60px;
        padding: 0 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #E8C098;
        border-bottom: 1px solid #e5e5e5;
        z-index: 1001;
    }

    .sidebar .logo img { width: 40px; height: auto; }

    .sidebar ul { display: none; } /* skryjeme desktop menu */
    .hamburger { display: flex; }
}

body, html, .container {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

.intro-section {
    padding: 0;
}

.content {
    padding: 0;
    background-color: transparent;
}

</style>
