<!DOCTYPE html>

<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
<title>Administrace focení | ŠAPI Foto</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
<style>
.admin-panel {
    max-width: 720px;
}
.admin-card {
    padding: 22px;
    margin: 20px 0;
    border: 1px solid #d5d5d5;
    border-radius: 8px;
    background: #fafafa;
}
.admin-card label.main-label {
    display:block;
    margin-top:16px;
    margin-bottom:6px;
    font-weight:600;
}
.admin-card input[type="text"],
.admin-card input[type="password"] {
    width:100%;
    box-sizing:border-box;
}
.categories {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px 18px;
    margin-top:12px;
}
.category-item {
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
}
.admin-actions {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:24px;
}
.admin-actions button {
    min-width:160px;
}
#stopBtn {
    background:#8d1d1d;
}
#statusBox {
    margin:20px 0;
    padding:15px;
    border:1px solid #ccc;
    border-radius:6px;
}
#message {
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:6px;
    border:1px solid #ccc;
}
.small {
    font-size:0.92em;
    opacity:0.8;
}
@media (max-width:700px) {
    .categories { grid-template-columns:1fr; }
}
</style>
<meta content="Administrace objednávek focení Dance Nation." name="description"/><link href="https://www.sapifoto.cz/admin-foceni.html" rel="canonical"/><meta content="website" property="og:type"/><meta content="Administrace focení | ŠAPI Foto" property="og:title"/><meta content="Administrace objednávek focení Dance Nation." property="og:description"/><meta content="https://www.sapifoto.cz/admin-foceni.html" property="og:url"/><meta content="https://www.sapifoto.cz/img/2.webp" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Administrace focení | ŠAPI Foto" name="twitter:title"/><meta content="Administrace objednávek focení Dance Nation." name="twitter:description"/></head>
<body>
<div class="container">
<aside class="sidebar">
<div class="logo"><a href="index.html"><img alt="ŠAPI Foto" height="399" src="img/logo.webp" width="450"/></a></div>
<ul>
<li class="home"><a aria-label="Úvodní stránka" href="index.html"><svg aria-hidden="true" focusable="false" viewbox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"></path></svg></a></li>
<li><a href="dnfoto.html">DN foto</a></li>
</ul>
<button aria-controls="mobileMenu" aria-expanded="false" aria-label="Otevřít hlavní menu" class="hamburger" id="hamburger" type="button"><span></span><span></span><span></span></button></aside><nav aria-label="Mobilní navigace" class="mobile-menu" id="mobileMenu"><ul><li><a href="index.html">Úvod</a></li><li><a href="dnfoto.html">DN foto</a></li></ul></nav>
<main class="content">
<h1>Administrace objednávek focení</h1>
<div class="admin-panel">
<div aria-live="polite" id="statusBox">
<strong>Aktuální stav:</strong> <span id="currentStatus">Načítám…</span><br/>
<span id="currentCompetition"></span><br/>
<span id="currentDeadline"></span>
</div>
<div class="admin-card">
<label class="main-label" for="password">Administrační heslo:</label>
<input autocomplete="current-password" id="password" maxlength="100" type="password"/>
<label class="main-label" for="competitionName">Název soutěže:</label>
<input id="competitionName" maxlength="180" placeholder="např. CDO Tábor Zemská liga" type="text"/>
<label class="main-label" for="competitionDate">Termín konání:</label>
<input id="competitionDate" inputmode="numeric" maxlength="30" placeholder="např. 3. 10. 2026" type="text"/>
<p class="small">Objednávky se automaticky ukončí den před uvedeným datem ve 12:00.</p>
<label class="main-label">Kategorie, pro které přijímám objednávky:</label>
<div class="categories" id="categories">
<label class="category-item"><input type="checkbox" value="Sólo MINI KIDS A"/> <span>Sólo MINI KIDS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN C"/> <span>Sólo CHILDREN C</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN B"/> <span>Sólo CHILDREN B</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN A"/> <span>Sólo CHILDREN A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN M"/> <span>Sólo CHILDREN M</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS C"/> <span>Sólo JUNIORS C</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS B"/> <span>Sólo JUNIORS B</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS A"/> <span>Sólo JUNIORS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS M"/> <span>Sólo JUNIORS M</span></label>
<label class="category-item"><input type="checkbox" value="Sólo ADULTS A"/> <span>Sólo ADULTS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo ADULTS M"/> <span>Sólo ADULTS M</span></label>
<label class="category-item"><input type="checkbox" value="Duo MINI KIDS A"/> <span>Duo MINI KIDS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo CHILDREN A"/> <span>Duo CHILDREN A</span></label>
<label class="category-item"><input type="checkbox" value="Duo CHILDREN M"/> <span>Duo CHILDREN M</span></label>
<label class="category-item"><input type="checkbox" value="Duo JUNIORS A"/> <span>Duo JUNIORS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo JUNIORS M"/> <span>Duo JUNIORS M</span></label>
<label class="category-item"><input type="checkbox" value="Duo ADULTS A"/> <span>Duo ADULTS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo ADULTS M"/> <span>Duo ADULTS M</span></label>
</div>
<div class="admin-actions">
<button id="startBtn" type="button">Spustit objednávky</button>
<button id="stopBtn" type="button">Zastavit objednávky</button>
</div>
<p class="small">
        Nezaškrtnuté kategorie se na veřejné stránce zobrazí pod textem
        „Nepřijímám objednávky pro:“.
    </p>
<div aria-live="polite" id="message"></div>
</div>
</div>
</main>
</div>
<script defer="" src="admin-foceni.js"></script><script defer="" src="main.js"></script></body>
</html>
