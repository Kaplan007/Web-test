<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Administrace focení | ŠAPI Foto</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.admin-panel {
    max-width: 720px;
}
.admin-card {
    padding: 22px;
    margin: 20px 0;
    border: 1px solid #d5d5d5;
    border-radius: 8px;
    background: #fafafa;
}
.admin-card label.main-label {
    display:block;
    margin-top:16px;
    margin-bottom:6px;
    font-weight:600;
}
.admin-card input[type="text"],
.admin-card input[type="password"] {
    width:100%;
    box-sizing:border-box;
}
.categories {
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px 18px;
    margin-top:12px;
}
.category-item {
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
}
.admin-actions {
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:24px;
}
.admin-actions button {
    min-width:160px;
}
#stopBtn {
    background:#8d1d1d;
}
#statusBox {
    margin:20px 0;
    padding:15px;
    border:1px solid #ccc;
    border-radius:6px;
}
#message {
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:6px;
    border:1px solid #ccc;
}
.small {
    font-size:0.92em;
    opacity:0.8;
}
@media (max-width:700px) {
    .categories { grid-template-columns:1fr; }
}
</style>
</head>
<body>
<div class="container">
<aside class="sidebar">
    <div class="logo"><a href="index.html"><img src="img/logo.webp" alt="Logo"></a></div>
    <ul>
        <li class="home"><a href="index.html"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg></a></li>
        <li><a href="dnfoto.html">DN foto</a></li>
    </ul>
</aside>

<main class="content">
<h1>Administrace objednávek focení</h1>

<div class="admin-panel">

<div id="statusBox">
    <strong>Aktuální stav:</strong> <span id="currentStatus">Načítám…</span><br>
    <span id="currentCompetition"></span>
</div>

<div class="admin-card">
    <label class="main-label" for="password">Administrační heslo:</label>
    <input id="password" type="password" autocomplete="current-password">

    <label class="main-label" for="competitionName">Název soutěže:</label>
    <input id="competitionName" type="text" placeholder="např. CDO Tábor Zemská liga">

    <label class="main-label" for="competitionDate">Termín konání:</label>
    <input id="competitionDate" type="text" placeholder="např. 3. 10. 2026">

    <label class="main-label">Kategorie, pro které přijímám objednávky:</label>

    <div class="categories" id="categories">
        <label class="category-item"><input type="checkbox" value="Sólo MINI KIDS A"> <span>Sólo MINI KIDS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN C"> <span>Sólo CHILDREN C</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN B"> <span>Sólo CHILDREN B</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN A"> <span>Sólo CHILDREN A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo CHILDREN M"> <span>Sólo CHILDREN M</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS C"> <span>Sólo JUNIORS C</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS B"> <span>Sólo JUNIORS B</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS A"> <span>Sólo JUNIORS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo JUNIORS M"> <span>Sólo JUNIORS M</span></label>
<label class="category-item"><input type="checkbox" value="Sólo ADULTS A"> <span>Sólo ADULTS A</span></label>
<label class="category-item"><input type="checkbox" value="Sólo ADULTS M"> <span>Sólo ADULTS M</span></label>
<label class="category-item"><input type="checkbox" value="Duo MINI KIDS A"> <span>Duo MINI KIDS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo CHILDREN A"> <span>Duo CHILDREN A</span></label>
<label class="category-item"><input type="checkbox" value="Duo CHILDREN M"> <span>Duo CHILDREN M</span></label>
<label class="category-item"><input type="checkbox" value="Duo JUNIORS A"> <span>Duo JUNIORS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo JUNIORS M"> <span>Duo JUNIORS M</span></label>
<label class="category-item"><input type="checkbox" value="Duo ADULTS A"> <span>Duo ADULTS A</span></label>
<label class="category-item"><input type="checkbox" value="Duo ADULTS M"> <span>Duo ADULTS M</span></label>
    </div>

    <div class="admin-actions">
        <button type="button" id="startBtn">Spustit objednávky</button>
        <button type="button" id="stopBtn">Zastavit objednávky</button>
    </div>

    <p class="small">
        Nezaškrtnuté kategorie se na veřejné stránce zobrazí pod textem
        „Nepřijímám objednávky pro:“.
    </p>

    <div id="message"></div>
</div>

</div>
</main>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysHFdWmBpfyKeNXBBCsYsWTRVsv5cLXiCeEqnc9lLYfdGYGIH8qwjQmYKbjVYjHL82Vw/exec';

const passwordEl = document.getElementById('password');
const nameEl = document.getElementById('competitionName');
const dateEl = document.getElementById('competitionDate');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const messageEl = document.getElementById('message');

function setMessage(text, ok) {
    messageEl.textContent = text;
    messageEl.style.display = 'block';
    messageEl.style.borderColor = ok ? '#6a9b6a' : '#c66';
    messageEl.style.background = ok ? '#f0fff0' : '#fff0f0';
}

function checkedCategories() {
    return Array.from(
        document.querySelectorAll('#categories input[type="checkbox"]:checked')
    ).map(el => el.value);
}

function applyConfig(config) {
    document.getElementById('currentStatus').textContent =
        config.orderingAvailable ? 'OBJEDNÁVKY JSOU SPUŠTĚNÉ' : 'OBJEDNÁVKY JSOU ZASTAVENÉ';

    document.getElementById('currentCompetition').textContent =
        config.competitionDisplay || '';

    if (config.competitionName) nameEl.value = config.competitionName;
    if (config.competitionDate) dateEl.value = config.competitionDate;

    const active = new Set(config.activeCategories || []);
    document.querySelectorAll('#categories input[type="checkbox"]').forEach(el => {
        el.checked = active.has(el.value);
    });
}

function loadConfig(callback) {
    const cb = 'adminConfig_' + Date.now();

    window[cb] = function(config) {
        try {
            applyConfig(config);
            if (callback) callback(config);
        } finally {
            delete window[cb];
            script.remove();
        }
    };

    const script = document.createElement('script');
    script.src =
        APPS_SCRIPT_URL +
        '?action=getConfig&callback=' +
        encodeURIComponent(cb) +
        '&_=' + Date.now();

    script.onerror = function() {
        setMessage('Nepodařilo se načíst aktuální nastavení.', false);
        delete window[cb];
        script.remove();
    };

    document.body.appendChild(script);
}

function postAdmin(command) {
    const password = passwordEl.value.trim();

    if (!password) {
        setMessage('Zadejte administrační heslo.', false);
        return;
    }

    const data = new URLSearchParams();
    data.set('action', 'adminSave');
    data.set('command', command);
    data.set('password', password);

    let expectedActive = false;
    let expectedName = '';
    let expectedDate = '';
    let expectedCategories = [];

    if (command === 'start') {
        expectedName = nameEl.value.trim();
        expectedDate = dateEl.value.trim();
        expectedCategories = checkedCategories();
        expectedActive = true;

        if (!expectedName) {
            setMessage('Zadejte název soutěže.', false);
            return;
        }

        if (!expectedDate) {
            setMessage('Zadejte termín konání.', false);
            return;
        }

        if (!expectedCategories.length) {
            setMessage('Vyberte alespoň jednu kategorii.', false);
            return;
        }

        data.set('competitionName', expectedName);
        data.set('competitionDate', expectedDate);
        data.set('activeCategories', JSON.stringify(expectedCategories));
    }

    startBtn.disabled = true;
    stopBtn.disabled = true;
    setMessage(
        command === 'start' ? 'Spouštím objednávky…' : 'Zastavuji objednávky…',
        true
    );

    fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: data.toString()
    }).then(() => {
        // Odpověď Apps Scriptu kvůli cross-origin režimu nečteme.
        // Změnu ověříme opětovným načtením veřejné konfigurace.
        setTimeout(() => {
            loadConfig(config => {
                let success = false;

                if (command === 'stop') {
                    success = !config.active;
                } else {
                    const sameCategories =
                        JSON.stringify([...(config.activeCategories || [])].sort()) ===
                        JSON.stringify([...expectedCategories].sort());

                    success =
                        config.active &&
                        config.competitionName === expectedName &&
                        config.competitionDate === expectedDate &&
                        sameCategories;
                }

                if (success) {
                    setMessage(
                        command === 'start'
                            ? 'Objednávky byly spuštěny.'
                            : 'Objednávky byly zastaveny.',
                        true
                    );
                } else {
                    setMessage(
                        'Změna se neuložila. Zkontrolujte heslo a nasazení Apps Scriptu.',
                        false
                    );
                }

                startBtn.disabled = false;
                stopBtn.disabled = false;
            });
        }, 1200);
    }).catch(err => {
        console.error(err);
        setMessage('Požadavek se nepodařilo odeslat.', false);
        startBtn.disabled = false;
        stopBtn.disabled = false;
    });
}

startBtn.addEventListener('click', () => postAdmin('start'));
stopBtn.addEventListener('click', () => postAdmin('stop'));

loadConfig();
</script>
</body>
</html>
